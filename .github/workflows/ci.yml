name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (CP1-CP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checkpoint tests
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        # CP5 gọi vào bản deploy đang sống, bonus kiểm tra chính badge của
        # workflow này → loại cả hai; test build Docker để job `build` lo.
        run: >
          pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:${{ github.sha }} .

      - name: Check image size (< 500MB)
        run: |
          size=$(docker image inspect day12-agent:${{ github.sha }} --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((500 * 1024 * 1024))

      - name: Container answers /health
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e AGENT_API_KEY=ci-dummy -e REDIS_URL=fake:// \
            day12-agent:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs agent
          exit 1

  deploy:
    name: Deploy
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
            echo "Render deploy triggered"
          elif [ -n "$RAILWAY_TOKEN" ]; then
            npx -y @railway/cli@4 up --ci ${RAILWAY_SERVICE:+--service "$RAILWAY_SERVICE"}
          else
            echo "::warning::Chưa cấu hình secret deploy (RENDER_DEPLOY_HOOK_URL hoặc RAILWAY_TOKEN) — bỏ qua bước deploy"
          fi

      - name: Smoke test
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          if [ -z "$PUBLIC_URL" ]; then
            echo "::warning::Chưa đặt biến PUBLIC_URL — bỏ qua smoke test"
            exit 0
          fi
          sleep 45
          for i in $(seq 1 10); do
            curl -fsS "$PUBLIC_URL/health" && exit 0
            sleep 15
          done
          exit 1
